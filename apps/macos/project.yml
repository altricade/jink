# The jink macOS app. Generate the Xcode project with `xcodegen` (in this
# folder); the project itself is not kept in git.
name: Jink
options:
  bundleIdPrefix: app.jink
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
packages:
  JinkKit:
    path: JinkKit
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    # Ad-hoc signed until there is a Developer ID.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    # The build step builds jink with cargo, outside the build folder.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Jink:
    type: application
    platform: macOS
    sources:
      - path: Jink
        excludes:
          - Info.plist
    dependencies:
      - package: JinkKit
        product: JinkUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.jink.Jink
        PRODUCT_NAME: Jink
        INFOPLIST_FILE: Jink/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Bundle the jink command
        path: bundle-jink.sh
        basedOnDependencyAnalysis: false
