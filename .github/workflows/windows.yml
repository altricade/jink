# jink on a real Windows machine. "rust": format, lint and tests, then a
# release build that is installed as a service and used
# (scripts/windows-smoke.ps1); the built jink.exe with its WinDivert driver
# is kept as the "jink-windows" artifact of each run. "app": the Windows
# app's gate (apps/windows/check.sh), then the app itself as the
# "jink-windows-app" artifact.
name: windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    env:
      # Line tables in jink.pdb, for the debugger if a step crashes (the
      # artifact does not carry the .pdb).
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: WinDivert (to build against, and to ship)
        shell: pwsh
        run: |
          scripts/windivert.ps1 -Out dist -Sdk windivert-sdk
          # Build against its WinDivert.lib; tests load its WinDivert.dll.
          "WINDIVERT_PATH=$PWD\windivert-sdk" >> $env:GITHUB_ENV
          "$PWD\windivert-sdk" >> $env:GITHUB_PATH
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --release -p jink-cli
      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/jink.exe dist/
          Copy-Item LICENSE dist/LICENSE.txt
      - name: Smoke test (service, pipe, capture)
        shell: pwsh
        run: scripts/windows-smoke.ps1 -Dist dist
      - name: If it crashed, where (the debugger's call stack)
        if: failure()
        shell: pwsh
        run: |
          Copy-Item target/release/jink.pdb dist/
          $cdb = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe" | Select-Object -First 1
          foreach ($command in @('--version', 'service status', 'service install')) {
            Write-Host "=== jink $command"
            & $cdb.FullName -G -y dist -c "sxe sov; g; .ecxr; kn 60; q" dist/jink.exe $command.Split(' ')
          }
          & dist/jink.exe service uninstall
      - uses: actions/upload-artifact@v4
        with:
          name: jink-windows
          path: dist/
          if-no-files-found: error

  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: apps/windows/global.json
      - name: Format, build and test
        shell: bash
        run: apps/windows/check.sh
      - name: Publish the app (with .NET and the Windows App SDK in it)
        run: dotnet publish apps/windows/src/Jink.App -c Release -o dist-app
      - uses: actions/upload-artifact@v4
        with:
          name: jink-windows-app
          path: dist-app/
          if-no-files-found: error
