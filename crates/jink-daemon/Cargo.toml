[package]
name = "jink-daemon"
description = "jink's background service: runs the engine, keeps the settings, and answers the apps over a local control channel."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Seeds the random fields of fakes.
getrandom = "0.4.3"
jink-core = { path = "../jink-core" }
# The finder's host checks: TLS with the `ring` backend (aws-lc needs cmake
# and nasm to build on Windows), certificates checked by the system, so that
# antivirus that inspects HTTPS with its own root still passes.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
# Certificates for the local test servers.
rcgen = "0.14.10"
# Paused time, for finding with engines that never come online.
tokio = { version = "1.54.1", features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
jink-macos = { path = "../jink-macos" }

[target.'cfg(windows)'.dependencies]
# The control pipe, with a security descriptor that lets signed-in users in
# (tokio's own named pipes take one only through unsafe code).
interprocess = { version = "2.4.10", features = ["tokio"] }
jink-windivert = { path = "../jink-windivert" }
# The pipe's security descriptor is given as a wide string.
widestring = "1.2.1"
# Running, installing and removing the Windows service.
windows-service = "0.8.1"

[lints]
workspace = true
