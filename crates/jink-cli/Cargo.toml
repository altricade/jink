[package]
name = "jink-cli"
description = "The jink command: check and run zapret-discord-youtube strategies."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "jink"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
jink-core = { path = "../jink-core" }
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
getrandom = "0.4.3"
jink-windivert = { path = "../jink-windivert" }

[target.'cfg(target_os = "macos")'.dependencies]
getrandom = "0.4.3"
jink-macos = { path = "../jink-macos" }

[dev-dependencies]
getrandom = "0.4.3"

[lints]
workspace = true
