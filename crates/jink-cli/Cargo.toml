[package]
name = "jink-cli"
description = "The jink command: check and run zapret-discord-youtube strategies."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "jink"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
jink-core = { path = "../jink-core" }
jink-daemon = { path = "../jink-daemon" }
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
jink-windivert = { path = "../jink-windivert" }

[target.'cfg(target_os = "macos")'.dependencies]
jink-macos = { path = "../jink-macos" }

[lints]
workspace = true
